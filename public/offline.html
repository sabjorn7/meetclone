<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#091747" />
    <title>Нет подключения — МитГуру</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Arial, sans-serif;
            background: #091747;
            color: #eaf0fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 360px; width: 100%; }
        .logo {
            width: 76px; height: 76px; margin: 0 auto 24px;
            border-radius: 18px; background: #5495f3;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 34px; color: #fff; letter-spacing: -1px;
        }
        h1 { font-size: 22px; line-height: 1.3; margin: 0 0 12px; font-weight: 700; }
        p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #9fb3d9; }
        button {
            appearance: none; border: 0; cursor: pointer;
            background: #5495f3; color: #fff;
            font-size: 16px; font-weight: 600;
            padding: 13px 28px; border-radius: 12px;
            transition: background .15s ease;
        }
        button:hover { background: #3f82e6; }
        button:active { background: #356fc9; }
        .hint { margin-top: 18px; font-size: 13px; color: #6f83a8; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="logo" aria-hidden="true">мг</div>
        <h1>Нет подключения к интернету</h1>
        <p>Проверьте соединение и попробуйте снова.</p>
        <button type="button" onclick="location.reload()">Повторить</button>
        <div class="hint">МитГуру</div>
    </div>
    <script>
        // Auto-retry the moment the connection returns.
        window.addEventListener('online', function () { location.reload(); });
    </script>
</body>
</html>
