name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump cache-buster version for this build
        run: |
          sed -i "s/window\.wwg_cacheVersion = [0-9]\+;/window.wwg_cacheVersion = ${{ github.run_number }};/" src/_front/router.js
          sed -i "s/const version = [0-9]\+;/const version = ${{ github.run_number }};/" public/serviceworker.js
          sed -i "s/\"cacheVersion\":\"[0-9]\+\"/\"cacheVersion\":\"${{ github.run_number }}\"/" public/data/*.json

      - name: Build
        run: npm run build

      # Atomic-ish two-phase deploy to avoid the cache-poisoning race: a single `rsync --delete` has a
      # window where the new index.html is live but its new hashed chunk (assets/main-<hash>.js) hasn't
      # uploaded yet — a browser loading in that window caches an empty chunk and white-screens until a
      # hard refresh. So we upload ALL non-HTML first (new chunks/data appear alongside the old ones, no
      # --delete), THEN upload the HTML and prune stale files. New HTML always resolves to a chunk that is
      # already on disk; in-flight old HTML still resolves to its old chunk (kept until phase 2's --delete).
      - name: Deploy assets first (chunks/data/css — no delete)
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          SOURCE: "dist/"
          TARGET: "/home/arseny/www-app/"
          ARGS: "-rlgoDzvc -i"
          EXCLUDE: "*.html"

      - name: Deploy HTML + prune stale (delete)
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          SOURCE: "dist/"
          TARGET: "/home/arseny/www-app/"
          ARGS: "-rlgoDzvc -i --delete"
